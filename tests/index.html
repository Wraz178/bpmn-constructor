<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>BPMN Constructor — автоматические проверки</title>
  <style>
    body { font-family: -apple-system, Segoe UI, Arial, sans-serif; margin: 24px; color: #1f2328; }
    h1 { font-size: 18px; }
    li { margin: 4px 0; font-family: Menlo, Consolas, monospace; font-size: 13px; }
    li.ok::before { content: "✔ "; color: #1a7f37; }
    li.fail::before { content: "✘ "; color: #cf222e; }
    #summary { margin-top: 16px; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Автоматические проверки модели и экспорта</h1>
  <ul id="list"></ul>
  <div id="summary"></div>
  <script src="../src/model.js"></script>
  <script src="../src/bpmn-export.js"></script>
  <script src="model.test.js"></script>
  <script>
    const list = document.getElementById('list');
    const results = window.__testResults || [];
    for (const r of results) {
      const li = document.createElement('li');
      li.className = r.ok ? 'ok' : 'fail';
      li.textContent = r.name + (r.ok ? '' : ' — ' + r.error);
      list.appendChild(li);
    }
    const passed = results.filter((r) => r.ok).length;
    document.getElementById('summary').textContent =
      `Пройдено ${passed} из ${results.length} проверок`;
  </script>
</body>
</html>
